<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Advanced To-Do List App</title>
    <meta name="description" content="Task management with completion trends, stats cards, and category distribution for effective productivity tracking." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Browser UI colour (matches your #070b14 background) -->
    <meta name="theme-color" content="#070b14" />
    <meta name="color-scheme" content="dark light" />

    <!-- Inline SVG favicon, no extra file needed -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>"
    />

    <!-- Open Graph / social preview -->
    <meta property="og:title" content="Advanced To-Do List App" />
    <meta property="og:description" content="Task analytics, completion trends and category insights." />
    <meta property="og:type" content="website" />

    <!-- Apply saved theme BEFORE first paint to prevent a light/dark flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>

    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background: #070b14; color: #e2eaf8; -webkit-font-smoothing: antialiased; }

      /* Lightweight pre-React loader, removed automatically when React mounts */
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: #070b14; z-index: 9999;
      }
      #boot i {
        width: 36px; height: 36px; border-radius: 50%;
        border: 3px solid #1e3058; border-top-color: #00d4ff;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #root:not(:empty) + #boot { display: none; }

      @media (prefers-reduced-motion: reduce) {
        #boot i { animation-duration: 2s; }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div id="boot" aria-label="Loading"><i></i></div>
    <noscript>This app needs JavaScript enabled to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
